name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (dist)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ais-pre-kvdgy66ti4jb5uaxguutbm-526314576081.us-west1.run.app' }}
        run: npm run build

      - name: Ensure Android Capacitor platform exists & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build downloadable Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload LingoNova APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoNova-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
